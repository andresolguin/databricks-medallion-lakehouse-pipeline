[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "iowa-lakehouse"
version = "1.0.0"
description = "Replay-safe Iowa Liquor Sales batch pipeline with PySpark and Delta Lake"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Andres Olguin" }]
dependencies = []

[project.optional-dependencies]
local = ["pyspark==4.0.1", "delta-spark==4.0.0"]
dev = ["pytest==8.4.2", "ruff==0.14.0", "build==1.3.0", "PyYAML==6.0.3"]
docs = ["matplotlib==3.10.8", "reportlab==4.4.9"]

[project.scripts]
iowa-lakehouse = "iowa_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: exercises real Delta tables and filesystem recovery"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
