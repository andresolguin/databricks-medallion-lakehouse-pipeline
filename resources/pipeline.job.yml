resources:
  jobs:
    iowa_pipeline:
      name: Iowa Liquor Sales Lakehouse
      max_concurrent_runs: 1
      parameters:
        - name: process_date
          default: ""
        - name: country
          default: usa
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: volume
          default: ${var.volume}
      environments:
        - environment_key: python
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: bronze
          environment_key: python
          max_retries: 1
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: ../scripts/run_task.py
            parameters:
              - --stage
              - bronze
              - --process-date
              - "{{job.parameters.process_date}}"
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
              - --volume
              - "{{job.parameters.volume}}"
              - --country
              - "{{job.parameters.country}}"
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: python
          max_retries: 1
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: ../scripts/run_task.py
            parameters:
              - --stage
              - silver
              - --process-date
              - "{{job.parameters.process_date}}"
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
              - --volume
              - "{{job.parameters.volume}}"
              - --country
              - "{{job.parameters.country}}"
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: python
          max_retries: 1
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: ../scripts/run_task.py
            parameters:
              - --stage
              - gold
              - --process-date
              - "{{job.parameters.process_date}}"
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
              - --volume
              - "{{job.parameters.volume}}"
              - --country
              - "{{job.parameters.country}}"
        - task_key: archive
          depends_on:
            - task_key: gold
          environment_key: python
          max_retries: 1
          min_retry_interval_millis: 10000
          spark_python_task:
            python_file: ../scripts/run_task.py
            parameters:
              - --stage
              - archive
              - --process-date
              - "{{job.parameters.process_date}}"
              - --catalog
              - "{{job.parameters.catalog}}"
              - --bronze-schema
              - "{{job.parameters.bronze_schema}}"
              - --silver-schema
              - "{{job.parameters.silver_schema}}"
              - --gold-schema
              - "{{job.parameters.gold_schema}}"
              - --volume
              - "{{job.parameters.volume}}"
              - --country
              - "{{job.parameters.country}}"
